name: debug api (temporaneo)
on:
  push:
    branches: [claude/project-thread-nj4pco]
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for i in 58620 21783; do
            echo "=== $i"; curl -sS -m 30 https://carburanti.mise.gov.it/ospzApi/registry/servicearea/$i | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('fuels'),indent=1))"
          done
          echo "=== CSV"; curl -sS -m 25 https://www.mimit.gov.it/images/exportCSV/prezzo_alle_8.csv | grep -E '^(58620|21783)\|' || echo "csv non raggiungibile"
