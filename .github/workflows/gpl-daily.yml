name: GPL giornaliero

on:
  schedule:
    # Il cron di GitHub è in UTC: le 9:00 a Roma sono le 8:00 UTC (ora solare)
    # oppure le 7:00 UTC (ora legale). Pianifichiamo entrambe e lo step
    # "orario" lascia proseguire solo il trigger giusto per la stagione,
    # così anche un avvio in ritardo non produce un doppio invio.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

# Permessi minimi: il job deve solo leggere il codice.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Orario (9 a Roma)
        id: gate
        run: |
          tz=$(TZ=Europe/Rome date +%Z)
          if [ "$tz" = "CEST" ]; then expected="0 7 * * *"; else expected="0 8 * * *"; fi
          echo "Fuso Roma: $tz - trigger atteso: '$expected' - ricevuto: '${{ github.event.schedule }}'"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$expected" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.gate.outputs.go == 'true'
        with:
          persist-credentials: false
      - name: Pubblica prezzi GPL
        if: steps.gate.outputs.go == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 gpl_monitor.py  # Python 3.12 già presente su ubuntu-latest
