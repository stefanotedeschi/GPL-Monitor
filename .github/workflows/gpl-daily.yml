name: GPL giornaliero

on:
  schedule:
    # Il cron di GitHub è in UTC e non è garantito: sotto carico un avvio può
    # slittare o saltare (succede spesso allo scoccare dell'ora). Pianifichiamo
    # quindi più tentativi tra le 7 e le 10 UTC, al minuto 5: lo script invia
    # al primo tentativo dalle 9 di Roma in poi (ora legale o solare) e salta
    # gli altri se il messaggio di oggi è già partito.
    - cron: "5 7,8,9,10 * * *"
  workflow_dispatch:
    inputs:
      programmato:
        description: "Comportati come l'invio programmato (una volta al giorno, dalle 9, aggiorna le frecce)"
        type: boolean
        default: false

# Permessi minimi: il job deve solo leggere il codice.
permissions:
  contents: read

# Un tentativo alla volta, così due avvii ravvicinati non inviano due volte.
concurrency:
  group: gpl-daily
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Prezzi dell'ultimo invio programmato, per le frecce ▲/▼ e per sapere
      # se il messaggio di oggi è già partito.
      - name: Recupera prezzi precedenti
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: state/last_prices.json
          key: gpl-state-${{ github.run_id }}
          restore-keys: gpl-state-
      - name: Pubblica prezzi GPL
        id: send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Solo l'invio programmato (cron di GitHub o avvio esterno con programmato=true)
          # aggiorna lo stato: le prove manuali non spostano il confronto.
          FLAGS: ${{ (github.event_name == 'schedule' || inputs.programmato) && '--save-state --once-per-day' || '' }}
        run: python3 gpl_monitor.py --state state/last_prices.json $FLAGS  # Python già presente su ubuntu-latest
      - name: Salva prezzi di oggi
        if: steps.send.outputs.saved == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: state/last_prices.json
          key: gpl-state-${{ github.run_id }}
